substitutions:
  onboard_led_pin: GPIO2
  onboard_led_inverted: "false"

esphome:
  name: pc-control
  friendly_name: PC Control
  on_boot:
    priority: 800
    then:
      - switch.turn_off: power_output
      - switch.turn_off: reset_output
      - light.turn_off: onboard_status_led

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "PC-Control-Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

# Final hardware mapping:
# GPIO27 -> PC817 #1 -> motherboard PWR_SW
# GPIO26 -> PC817 #2 -> motherboard RESET_SW
# GPIO25 <- PC817 #3 <- motherboard PWR_LED
# GPIO2  -> onboard ESP32 LED (common DevKit default)

switch:
  - platform: gpio
    id: power_output
    internal: true
    pin:
      number: GPIO27
      mode: OUTPUT
      inverted: false
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: reset_output
    internal: true
    pin:
      number: GPIO26
      mode: OUTPUT
      inverted: false
    restore_mode: ALWAYS_OFF

output:
  - platform: gpio
    id: onboard_led_output
    pin:
      number: ${onboard_led_pin}
      inverted: ${onboard_led_inverted}

light:
  - platform: binary
    id: onboard_status_led
    internal: true
    output: onboard_led_output
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: pc_power_state
    name: "PC Power State"
    device_class: power
    pin:
      number: GPIO25
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

button:
  - platform: template
    name: "PC Power"
    icon: "mdi:power"
    on_press:
      - script.execute: power_short_press

  - platform: template
    name: "PC Reset"
    icon: "mdi:restart"
    on_press:
      - script.execute: reset_press

  - platform: template
    name: "PC Force Off"
    icon: "mdi:power-plug-off"
    on_press:
      - script.execute: power_force_off

  - platform: template
    name: "PC Power Cycle"
    icon: "mdi:restart-alert"
    on_press:
      - script.execute: power_cycle

script:
  - id: power_short_press
    mode: single
    then:
      - switch.turn_on: power_output
      - delay: 250ms
      - switch.turn_off: power_output

  - id: reset_press
    mode: single
    then:
      - switch.turn_on: reset_output
      - delay: 250ms
      - switch.turn_off: reset_output

  - id: power_force_off
    mode: single
    then:
      - switch.turn_on: power_output
      - delay: 4s
      - switch.turn_off: power_output

  - id: power_cycle
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: pc_power_state
          then:
            - switch.turn_on: power_output
            - delay: 4s
            - switch.turn_off: power_output
            - wait_until:
                condition:
                  binary_sensor.is_off: pc_power_state
                timeout: 10s
            - delay: 2s
      - switch.turn_on: power_output
      - delay: 250ms
      - switch.turn_off: power_output

globals:
  - id: led_tick
    type: int
    restore_value: no
    initial_value: '0'

interval:
  - interval: 250ms
    then:
      # Counter: 0..7 = 2 seconds
      - lambda: |-
          id(led_tick) = (id(led_tick) + 1) % 8;

      # Highest priority: Wi-Fi disconnected
      - if:
          condition:
            not:
              wifi.connected:
          then:
            # Fast blink: 250 ms ON / 250 ms OFF
            - if:
                condition:
                  lambda: 'return (id(led_tick) % 2) == 0;'
                then:
                  - light.turn_on: onboard_status_led
                else:
                  - light.turn_off: onboard_status_led

          else:
            # Wi-Fi is connected
            - if:
                condition:
                  binary_sensor.is_on: pc_power_state
                then:
                  # PC ON = solid LED
                  - light.turn_on: onboard_status_led

                else:
                  # PC OFF = short flash every 2 seconds
                  - if:
                      condition:
                        lambda: 'return id(led_tick) == 0;'
                      then:
                        - light.turn_on: onboard_status_led
                      else:
                        - light.turn_off: onboard_status_led
